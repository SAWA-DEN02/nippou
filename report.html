<style>

.top-title .title { font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(29,158,117,0.8); }

.nav-btn:active { background: rgba(29,158,117,0.2); }

.mode-row .tab { padding: 8px; font-size: 13px; }
.reload-btn { background: rgba(29,158,117,0.15); border: 1px solid rgba(29,158,117,0.4); border-radius: 10px; padding: 8px 16px; cursor: pointer; font-size: 13px; color: #1D9E75; margin: 0 auto 16px; display: block; }
.reload-btn:active { background: rgba(29,158,117,0.3); }
.section-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; margin-bottom: 10px; margin-top: 20px; }
.card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.card-name { font-size: 15px; font-weight: 600; color: #fff; }
.card-total { font-size: 20px; font-weight: 700; color: #1D9E75; text-shadow: 0 0 8px rgba(29,158,117,0.5); }
.card-total span { font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.4); margin-left: 2px; }
.detail-list { border-top: 1px solid rgba(255,255,255,0.06); padding-top: 8px; }
.detail-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }

.tab { flex: 1; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5); text-align: center; }
.tab.active { background: rgba(29,158,117,0.2); border-color: #1D9E75; color: #1D9E75; }

.log-info .log-date { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 3px; }
.log-info .log-site { font-size: 15px; font-weight: 600; color: #fff; }

.log-del:active { background: rgba(239,154,154,0.1); }

.cal-weekday.sun { color: #ef9a9a; }

.log-edit { background: none; border: 1px solid rgba(29,158,117,0.5); border-radius: 8px; color: #1D9E75; font-size: 13px; cursor: pointer; padding: 6px 10px; }
.log-edit:active { background: rgba(29,158,117,0.15); }

.ef-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff; font-size: 16px; padding: 10px 12px; font-family: inherit; }
.ef-input:focus { outline: none; border-color: #1D9E75; }
textarea.ef-input { min-height: 60px; resize: vertical; }
select.ef-input option { background: #1a1a2e; }

.ef-task-del { background: none; border: 1px solid rgba(239,154,154,0.3); border-radius: 8px; color: #ef9a9a; width: 40px; cursor: pointer; flex-shrink: 0; }

.ef-save:disabled { opacity: 0.5; }

<body>

<div id="toast"style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:20px;font-size:14px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;max-width:86vw;text-align:center;line-height:1.5;color:#fff;background:#1D9E75;"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyFkpTdMK815NKHOgawnBzSs6CYLKudXZMunQsD2aBZG0d6FsdDZWmWIwhuii7S-AEy/exec';

let current = new Date();
let allData = [];
let currentTab = 'summary';

// 集計期間の区切り方。'month' は1日〜末日、'closing' は前月21日〜当月20日（20日締め）。
// closing では締め日（20日）が入っている月をその期間の呼び名にする（8/21〜9/20 なら9月分）。
let periodMode = 'month';
try { periodMode = localStorage.getItem('period_mode') === 'closing' ? 'closing' : 'month'; } catch(e) {}

// GAS のエラーを、原因の見当がつく言葉に置き換える。
// Googleドライブの容量が上限を超えると、読み取りはできるのに書き込みだけが
// 「ドキュメントにアクセスする権限がありません」で失敗するため、そこを案内する。
function gasErrorText(message, fallback, verb) {
  if (/権限|permission/i.test(String(message || ''))) {
    return `Googleドライブの容量オーバーで${verb || '削除'}できません。容量を空けてから試してください`;
  }
  return fallback;
}

// innerHTML に値を差し込む前に必ず通す（現場名や作業者名に ' " < > & が入っても壊れないようにするため）
function escHtml(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function changeMonth(diff) {
  current = new Date(current.getFullYear(), current.getMonth() + diff, 1);
  render();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-summary').classList.toggle('active', tab === 'summary');
  document.getElementById('tab-log').classList.toggle('active', tab === 'log');
  render();
}

function switchMode(mode) {
  periodMode = mode;
  try { localStorage.setItem('period_mode', mode); } catch(e) {}
  render();
}

function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 表示中の集計期間を返す。from と to はどちらもその日を含む。
function getPeriod() {
  const y = current.getFullYear();
  const m = current.getMonth();
  if (periodMode === 'closing') {
    const from = new Date(y, m - 1, 21);
    const to = new Date(y, m, 20);
    return {
      from: ymd(from),
      to: ymd(to),
      label: `${y}年${m + 1}月分`,
      sub: `${from.getMonth() + 1}/${from.getDate()} 〜 ${to.getMonth() + 1}/${to.getDate()}`
    };
  }
  const from = new Date(y, m, 1);
  const to = new Date(y, m + 1, 0);
  return { from: ymd(from), to: ymd(to), label: `${y}年${m + 1}月`, sub: '' };
}

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading">読み込み中...</div>';
  try {
    const res = await fetch(GAS_URL + '?type=reports');
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message || 'サーバーエラー');
    allData = data.data;
    localStorage.setItem('cache_reports', JSON.stringify(allData));
  } catch(e) {
    // 通信に失敗したときだけでなく、GAS がエラーを返したときもキャッシュにフォールバックする
    try {
      const cached = localStorage.getItem('cache_reports');
      if (cached) allData = JSON.parse(cached);
    } catch(e2) {}
    showToast('最新データを取得できませんでした');
  }
  render();
}

function getPeriodData() {
  const p = getPeriod();
  return allData.filter(row => {
    // GAS は YYYY-MM-DD で返すが、古いデータで YYYY/MM/DD が混ざっていても拾えるようにする
    const d = String(row.date || '').substring(0, 10).replace(/\//g, '-');
    if (d.length !== 10) return false;
    return d >= p.from && d <= p.to;
  });
}

function render() {
  const p = getPeriod();
  document.getElementById('monthLabel').innerHTML =
    escHtml(p.label) + (p.sub ? `<div class="sub">${escHtml(p.sub)}</div>` : '');
  document.getElementById('mode-month').classList.toggle('active', periodMode === 'month');
  document.getElementById('mode-closing').classList.toggle('active', periodMode === 'closing');
  const monthData = getPeriodData();
  if (currentTab === 'summary') renderSummary(monthData);
  else renderLog(monthData);
}

function renderSummary(monthData) {
  if (monthData.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty">この月の日報データはありません</div>';
    return;
  }

  const workerMap = {};
  const siteMap = {};

  monthData.forEach(row => {
    const workers = row.workers ? String(row.workers).split('、') : [];
    const site = row.site || '';
    workers.forEach(w => {
      w = w.trim();
      if (!w) return;
      if (!workerMap[w]) workerMap[w] = { total: 0, sites: {} };
      workerMap[w].total++;
      if (!workerMap[w].sites[site]) workerMap[w].sites[site] = 0;
      workerMap[w].sites[site]++;
    });
    if (site) {
      if (!siteMap[site]) siteMap[site] = { total: 0, workers: {} };
      siteMap[site].total++;
      workers.forEach(w => {
        w = w.trim();
        if (!w) return;
        if (!siteMap[site].workers[w]) siteMap[site].workers[w] = 0;
        siteMap[site].workers[w]++;
      });
    }
  });

  const totalDays = monthData.length;
  const totalWorkers = Object.keys(workerMap).length;
  const totalSites = Object.keys(siteMap).length;

  let html = `
    <div class="summary-card">
      <div class="summary-item">
        <div class="summary-num">${totalDays}</div>
        <div class="summary-label">総作業日数</div>
      </div>
      <div class="summary-item">
        <div class="summary-num">${totalWorkers}</div>
        <div class="summary-label">作業者数</div>
      </div>
      <div class="summary-item">
        <div class="summary-num">${totalSites}</div>
        <div class="summary-label">現場数</div>
      </div>
    </div>
    <div class="section-title">作業者別</div>
  `;

  Object.entries(workerMap).sort((a,b) => b[1].total - a[1].total).forEach(([name, data]) => {
    html += `
      <div class="card">
        <div class="card-header">
          <div class="card-name">${escHtml(name)}</div>
          <div class="card-total">${data.total}<span>日</span></div>
        </div>
        <div class="detail-list">
          ${Object.entries(data.sites).sort((a,b) => b[1]-a[1]).map(([site, count]) =>
            `<div class="detail-item"><div class="detail-name">${escHtml(site)}</div><div class="detail-count">${count}日</div></div>`
          ).join('')}
        </div>
      </div>`;
  });

  // 現場別のカードはやめて、その場所に期間のカレンダーを出す。
  // 色が現場、文字が作業者。下の凡例が現場ごとの日数を兼ねている。
  const siteOrder = Object.entries(siteMap).sort((a, b) => b[1].total - a[1].total).map(([name]) => name);
  html += renderCalendar(monthData, getPeriod(), siteOrder);
  html += renderSiteLegend(siteMap, siteOrder);

  document.getElementById('content').innerHTML = html;
}

const SITE_COLORS = [
  { bg: 'rgba(29,158,117,0.30)',  text: '#7fe3c0' },
  { bg: 'rgba(21,101,192,0.30)',  text: '#a8d5ff' },
  { bg: 'rgba(230,81,0,0.30)',    text: '#ffcc80' },
  { bg: 'rgba(136,14,79,0.30)',   text: '#f8a8c4' },
  { bg: 'rgba(123,31,162,0.30)',  text: '#d7a8f0' },
  { bg: 'rgba(255,193,7,0.25)',   text: '#ffe082' },
  { bg: 'rgba(0,150,136,0.30)',   text: '#8ce0d6' },
  { bg: 'rgba(96,125,139,0.35)',  text: '#c3d4dc' }
];

function parseYmd(s) {
  const parts = String(s).split('-');
  return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
}

function siteColor(siteOrder, site) {
  const i = siteOrder.indexOf(site);
  return i < 0 ? SITE_COLORS[SITE_COLORS.length - 1] : SITE_COLORS[i % SITE_COLORS.length];
}

// カレンダーの色と、日付をタップしたときの詳細の色を合わせるために覚えておく
let currentSiteOrder = [];

function renderCalendar(data, p, siteOrder) {
  currentSiteOrder = siteOrder;
  const byDate = {};
  data.forEach(r => {
    const d = String(r.date || '').substring(0, 10).replace(/\//g, '-');
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(r);
  });

  // 期間の最初の週の日曜から、最後の週の土曜までを並べる。
  // 20日締めだと月をまたぐので、月のカレンダーではなく期間のカレンダーにしている。
  const start = parseYmd(p.from);
  start.setDate(start.getDate() - start.getDay());
  const end = parseYmd(p.to);
  end.setDate(end.getDate() + (6 - end.getDay()));
  const todayStr = ymd(new Date());

  let html = '<div class="section-title">カレンダー</div>';
  html += '<div class="cal-hint">色が現場、文字が作業者です。日付をタップすると詳細が開きます</div>';
  html += '<div class="cal-weekdays">' +
    ['日', '月', '火', '水', '木', '金', '土'].map((w, i) =>
      `<div class="cal-weekday${i === 0 ? ' sun' : (i === 6 ? ' sat' : '')}">${w}</div>`).join('') +
    '</div><div class="calendar">';

  for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const key = ymd(d);
    const inPeriod = key >= p.from && key <= p.to;
    const col = d.getDay();
    let cls = inPeriod ? '' : ' out';
    if (col === 0) cls += ' sun';
    else if (col === 6) cls += ' sat';
    if (key === todayStr) cls += ' today';

    const rows = inPeriod ? (byDate[key] || []) : [];
    const chips = rows.slice(0, 2).map(r => {
      const c = siteColor(siteOrder, r.site || '');
      return `<div class="cal-ev" style="background:${c.bg};color:${c.text};">${escHtml(r.workers || '―')}</div>`;
    }).join('');
    const more = rows.length > 2 ? `<div class="cal-more">+${rows.length - 2}</div>` : '';
    // 日報がある日だけタップできるようにする（セルは狭くて作業者名が読めないため）
    const tap = rows.length > 0
      ? ` data-date="${escHtml(key)}" onclick="openDayModal(this.dataset.date)"`
      : '';
    html += `<div class="cal-day${cls}${rows.length > 0 ? ' has' : ''}"${tap}><div class="cal-num">${d.getDate()}</div>${chips}${more}</div>`;
  }
  return html + '</div>';
}

// カレンダーのセルは狭くて作業者名が省略されるので、タップしたら全部読める形で出す
function openDayModal(dateStr) {
  const rows = allData.filter(r =>
    String(r.date || '').substring(0, 10).replace(/\//g, '-') === dateStr);
  document.getElementById('dayModalTitle').textContent = formatDate(dateStr);

  const body = document.getElementById('dayModalBody');
  if (rows.length === 0) {
    body.innerHTML = '<div class="day-empty">この日の日報はありません</div>';
  } else {
    const line = (k, v) => v ? `<div class="day-row"><div class="k">${escHtml(k)}</div><div class="v">${escHtml(v)}</div></div>` : '';
    const yen = v => { const n = Number(v); return n > 0 ? n.toLocaleString() + '円' : ''; };
    body.innerHTML = rows.map(r => {
      const c = siteColor(currentSiteOrder, r.site || '');
      return `<div class="day-card">
        <div class="site"><div class="dot" style="background:${c.bg};border:1px solid ${c.text};"></div>${escHtml(r.site || '（現場名なし）')}</div>
        <div class="day-row"><div class="k">作業者</div><div class="v workers">${escHtml(r.workers || '―')}</div></div>
        ${line('作業時間', r.timeStr)}
        ${line('作業内容', r.tasks)}
        ${line('駐車場代', yen(r.parking))}
        ${line('高速代', yen(r.highway))}
        ${line('備考', r.notes)}
      </div>`;
    }).join('');
  }
  document.getElementById('dayModalBg').classList.add('show');
}

function closeDayModal(e) {
  if (e.target === document.getElementById('dayModalBg')) closeDayModalDirect();
}

function closeDayModalDirect() {
  document.getElementById('dayModalBg').classList.remove('show');
}

function renderSiteLegend(siteMap, siteOrder) {
  if (siteOrder.length === 0) return '';
  let html = '<div class="site-legend">';
  siteOrder.forEach(name => {
    const c = siteColor(siteOrder, name);
    html += `<div class="site-legend-item">
      <div class="site-legend-dot" style="background:${c.bg};border:1px solid ${c.text};"></div>
      <div class="site-legend-name">${escHtml(name)}</div>
      <div class="site-legend-count">${siteMap[name].total}日</div>
    </div>`;
  });
  return html + '</div>';
}

function renderLog(monthData) {
  if (monthData.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty">この月の日報データはありません</div>';
    return;
  }

  const sorted = [...monthData].sort((a, b) => {
    const da = String(a.date), db = String(b.date);
    return db.localeCompare(da);
  });

  let html = '';
  sorted.forEach(row => {
    const rawDate = row.date || '';
    const dateStr = String(rawDate).substring(0, 10);
    const dateLabel = formatDate(dateStr);
    html += `
      <div class="log-item">
        <div class="log-info">
          <div class="log-date">${escHtml(dateLabel)}</div>
          <div class="log-site">${escHtml(row.site)}</div>
          <div class="log-worker">${escHtml(row.workers)}</div>
        </div>
        <div class="log-btns">
          <button class="log-edit" data-id="${escHtml(row.id || '')}" onclick="openEditModal(this.dataset.id)">編集</button>
          <button class="log-del" data-id="${escHtml(row.id || '')}" data-date="${escHtml(dateStr)}" data-site="${escHtml(row.site)}" onclick="deleteReport(this.dataset.id, this.dataset.date, this.dataset.site)">削除</button>
        </div>
      </div>`;
  });

  document.getElementById('content').innerHTML = html;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  const wd = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${wd}）`;
}

async function deleteReport(id, date, site) {
  if (!confirm(`${formatDate(date)}\n${site}\n\nこの日報を削除しますか？`)) return;
  try {
    // ID があれば ID で消す（同じ日・同じ現場の日報が2件あっても取り違えない）。
    // GAS がまだ更新されておらず ID を持っていない日報は、従来どおり日付＋現場名で消す。
    const query = id
      ? `?type=deleteReport&id=${encodeURIComponent(id)}`
      : `?type=deleteReport&date=${encodeURIComponent(date)}&site=${encodeURIComponent(site)}`;
    const res = await fetch(GAS_URL + query);
    const text = await res.text();
    let result;
    try { result = JSON.parse(text); } catch(e) { result = { status: 'error' }; }
    if (result.status === 'ok') {
      if (id) {
        const idx = allData.findIndex(r => r.id === id);
        if (idx >= 0) allData.splice(idx, 1);
      } else {
        // ID が無い場合、GAS 側は下の行から探して最初に一致した1件だけを削除するので、
        // 画面側も同じく最後の1件だけを消す（表示がズレないように）
        for (let i = allData.length - 1; i >= 0; i--) {
          const d = String(allData[i].date || '').substring(0, 10);
          if (d === date && allData[i].site === site) { allData.splice(i, 1); break; }
        }
      }
      localStorage.setItem('cache_reports', JSON.stringify(allData));
      showToast('削除しました');
      render();
    } else {
      showToast(gasErrorText(result && result.message, '削除に失敗しました'));
    }
  } catch(e) {
    showToast('削除に失敗しました');
  }
}

/* ---------- 日報の編集 ---------- */

let editingId = '';
let editWorkers = [];
let masterSites = null;   // 設定画面で登録した現場名（初回の編集時に取得）
let masterWorkers = null; // 設定画面で登録した作業者

async function loadMasters() {
  if (masterSites && masterWorkers) return;
  try {
    const [s, w] = await Promise.all([
      fetch(GAS_URL + '?type=sites').then(r => r.json()),
      fetch(GAS_URL + '?type=workers').then(r => r.json())
    ]);
    masterSites = s.status === 'ok' ? s.data.map(String) : [];
    masterWorkers = w.status === 'ok' ? w.data.map(String) : [];
  } catch(e) {
    // 取れなくても、日報に入っている現場名・作業者だけで編集はできる
    masterSites = masterSites || [];
    masterWorkers = masterWorkers || [];
  }
}

async function openEditModal(id) {
  const row = allData.find(r => r.id === id);
  if (!id || !row) {
    showToast('この日報は編集できません。「最新データを取得」してから試してください');
    return;
  }
  editingId = id;
  showToast('読み込み中...');
  await loadMasters();

  const dateStr = String(row.date || '').substring(0, 10).replace(/\//g, '-');
  document.getElementById('efDate').value = dateStr;

  // 登録済みの現場名から消された現場でも、元の値を選べるように残す
  const site = String(row.site || '');
  const sites = masterSites.includes(site) || !site ? masterSites : [site, ...masterSites];
  document.getElementById('efSite').innerHTML = sites.map(s =>
    `<option value="${escHtml(s)}"${s === site ? ' selected' : ''}>${escHtml(s)}</option>`).join('');

  editWorkers = String(row.workers || '').split('、').map(w => w.trim()).filter(Boolean);
  renderEditWorkers();

  // 作業時間は「08:00 〜 17:00」「08:00 〜」「―」のどれかで保存されている
  const times = String(row.timeStr || '').match(/\d{1,2}:\d{2}/g) || [];
  document.getElementById('efStart').value = times[0] ? times[0].padStart(5, '0') : '';
  document.getElementById('efEnd').value = times[1] ? times[1].padStart(5, '0') : '';

  document.getElementById('efTasks').innerHTML = '';
  const tasks = String(row.tasks || '').split('\n').map(t => t.trim()).filter(Boolean);
  (tasks.length ? tasks : ['']).forEach(t => addEditTask(t));

  document.getElementById('efParking').value = Number(row.parking) > 0 ? Number(row.parking) : '';
  document.getElementById('efHighway').value = Number(row.highway) > 0 ? Number(row.highway) : '';
  document.getElementById('efNotes').value = row.notes || '';

  const btn = document.getElementById('efSaveBtn');
  btn.disabled = false;
  btn.textContent = '保存する';
  document.getElementById('editModalBg').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModalBg').classList.remove('show');
}

function renderEditWorkers() {
  // 登録済みの作業者に加えて、日報に入っているが登録から外れた作業者も表示する
  const names = [...masterWorkers];
  editWorkers.forEach(w => { if (!names.includes(w)) names.push(w); });
  document.getElementById('efWorkers').innerHTML = names.map(n =>
    `<div class="ef-pill${editWorkers.includes(n) ? ' on' : ''}" data-name="${escHtml(n)}" onclick="toggleEditWorker(this.dataset.name)">${escHtml(n)}</div>`).join('');
}

function toggleEditWorker(name) {
  const i = editWorkers.indexOf(name);
  if (i >= 0) editWorkers.splice(i, 1);
  else editWorkers.push(name);
  renderEditWorkers();
}

function addEditTask(value) {
  const div = document.createElement('div');
  div.className = 'ef-task';
  div.innerHTML = `<textarea class="ef-input" placeholder="作業内容を入力"></textarea><button class="ef-task-del" onclick="removeEditTask(this)">✕</button>`;
  div.querySelector('textarea').value = value;
  document.getElementById('efTasks').appendChild(div);
}

function removeEditTask(btn) {
  if (document.querySelectorAll('#efTasks .ef-task').length > 1) btn.parentElement.remove();
}

// 日報アプリ（index.html）と同じ形式の本文を作る。カレンダーの説明欄に入る。
function buildReportText(r) {
  let text = `【日報】${formatDate(r.date)}\n`;
  text += `━━━━━━━━━━━━━━━\n`;
  text += `■ 現場名\n${r.site}\n\n`;
  text += `■ 作業者\n${r.workers}\n\n`;
  text += `■ 作業時間\n${r.timeStr}\n\n`;
  text += `■ 作業内容\n`;
  r.tasks.split('\n').forEach((t, i) => { text += `${i + 1}. ${t}\n`; });
  if (r.parking) text += `\n■ 駐車場代\n${parseInt(r.parking).toLocaleString()}円`;
  if (r.highway) text += `\n■ 高速代\n${parseInt(r.highway).toLocaleString()}円`;
  if (r.notes) text += `\n■ 備考\n${r.notes}`;
  return text;
}

async function saveEdit() {
  const date = document.getElementById('efDate').value;
  const site = document.getElementById('efSite').value;
  const start = document.getElementById('efStart').value;
  const end = document.getElementById('efEnd').value;
  const tasks = Array.from(document.querySelectorAll('#efTasks textarea')).map(t => t.value.trim()).filter(Boolean);
  const parking = document.getElementById('efParking').value;
  const highway = document.getElementById('efHighway').value;
  const notes = document.getElementById('efNotes').value.trim();
  if (!date) { alert('日付を選択してください'); return; }
  if (!site) { alert('現場名を選択してください'); return; }
  if (editWorkers.length === 0) { alert('作業者を選択してください'); return; }
  if (tasks.length === 0) { alert('作業内容を1つ以上入力してください'); return; }

  const updated = {
    id: editingId,
    date, site,
    workers: editWorkers.join('、'),
    timeStr: (start && end) ? `${start} 〜 ${end}` : (start ? `${start} 〜` : '―'),
    tasks: tasks.join('\n'),
    parking, highway, notes
  };

  const btn = document.getElementById('efSaveBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';
  try {
    // text/plain にすると CORS のプリフライトが飛ばず、GAS の応答を読める（日報アプリと同じ方式）
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'updateReport',
        title: `日報 ${site}`,
        detail: buildReportText(updated),
        ...updated
      })
    });
    let result;
    try { result = JSON.parse(await res.text()); } catch(e) { result = { status: 'error' }; }
    if (result.status !== 'ok') {
      const msg = result.message === 'unknown action'
        ? 'GASが古いままです。GASを新バージョンで再デプロイしてください'
        : gasErrorText(result.message, '保存に失敗しました', '保存');
      showToast(msg);
      btn.disabled = false;
      btn.textContent = '保存する';
      return;
    }
    const idx = allData.findIndex(r => r.id === editingId);
    if (idx >= 0) allData[idx] = { ...allData[idx], ...updated };
    try { localStorage.setItem('cache_reports', JSON.stringify(allData)); } catch(e) {}
    closeEditModal();
    showToast(result.calendar === false ? '保存しました（カレンダー登録は失敗）' : '保存しました');
    render();
  } catch(e) {
    showToast('保存に失敗しました');
    btn.disabled = false;
    btn.textContent = '保存する';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2000);
}

loadData();
